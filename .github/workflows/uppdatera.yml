name: Slotline – uppdatera statistik

on:
  schedule:
    # Uppdateringarna startas av schemalagda uppgifter i Claude kl. 08.55 och 21.55 svensk tid.
    # GitHubs eget schema startar ofta flera timmar sent och används bara som reserv:
    # jobbet "klocka" hoppar över körningen om sidan redan uppdaterats de senaste 8 timmarna.
    - cron: "33 7 * * *"
    - cron: "33 20 * * *"
  workflow_dispatch: # gör att du kan starta en körning för hand under fliken Actions

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uppdatera
  cancel-in-progress: false

jobs:
  klocka:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.tid.outputs.kor }}
    steps:
      - name: Behövs en reservkörning?
        id: tid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "kor=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          SIST=$(gh api "repos/${{ github.repository }}/actions/workflows/uppdatera.yml/runs?event=workflow_dispatch&status=success&per_page=1" --jq '.workflow_runs[0].created_at' || echo "")
          if [ -n "$SIST" ] && [ $(( $(date +%s) - $(date -d "$SIST" +%s) )) -lt 28800 ]; then
            echo "kor=false" >> "$GITHUB_OUTPUT"; echo "Sidan uppdaterades $SIST – ingen reservkörning behövs."
          else
            echo "kor=true" >> "$GITHUB_OUTPUT"
          fi

  bygg:
    needs: klocka
    if: needs.klocka.outputs.kor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Hämta koden
        uses: actions/checkout@v5

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera paket och webbläsare för bilderna
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Hämta sparad matchdata från förra körningen
        uses: actions/cache/restore@v5
        with:
          path: nhl_data
          key: nhl-data-${{ github.run_id }}
          restore-keys: |
            nhl-data-

      - name: Hämta nya matcher från NHL och räkna statistik
        run: python nhl_stats.py --mapp nhl_data

      - name: Bygg webbsidan och matchkorten
        run: python bygg_sida.py --data nhl_data --ut site --bilder

      - name: Spara matchdata till nästa körning
        if: always()
        uses: actions/cache/save@v5
        with:
          path: nhl_data
          key: nhl-data-${{ github.run_id }}

      - name: Spara tabellerna i projektet
        run: |
          SASONG=$(ls -d nhl_data/*/csv | sort | tail -1 | cut -d/ -f2)
          mkdir -p statistik
          for f in Spelare Målvakter Lag Matcher Vinstchans Prognoser "Lag per match" "Målvakter per match" "Lag förra säsongen" "Målvakter förra säsongen"; do
            if [ -f "nhl_data/$SASONG/csv/$f.csv" ]; then cp "nhl_data/$SASONG/csv/$f.csv" statistik/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistik
          git diff --cached --quiet || git commit -m "Statistik $(date -u +%F)"
          git push

      - name: Ladda upp webbsidan
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicera på GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
